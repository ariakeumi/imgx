name: Release desktop

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: 1.97.1

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate versions
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(grep -m1 'MARKETING_VERSION' macos/IMGo.xcodeproj/project.pbxproj | sed -E 's/.*= ([0-9.]+);.*/\1/')"
          echo "tag: ${VERSION}, project: ${PROJECT_VERSION}"
          [ -n "${PROJECT_VERSION}" ] || { echo "MARKETING_VERSION not found" >&2; exit 1; }
          [ "${VERSION}" = "${PROJECT_VERSION}" ] || {
            echo "Tag v${VERSION} does not match project version ${PROJECT_VERSION}" >&2
            exit 1
          }

      - name: Expose version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Build macOS universal app
    runs-on: macos-15
    needs: metadata
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install native build dependencies
        run: brew install cmake ninja meson nasm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Apply native source patches
        run: ./scripts/init-deps.sh

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal-${{ hashFiles('deps/*.patch') }}
          cache-targets: false

      - name: Build Rust core (universal)
        run: ./macos/build-core.sh --universal

      - name: Build app (Release)
        run: |
          set -o pipefail
          xcodebuild -project macos/IMGo.xcodeproj \
            -scheme IMGo \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedBuildPath macos/build \
            CODE_SIGN_IDENTITY=- \
            build \
            | tail -20

      - name: Package DMG
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          APP="macos/build/Release/IMGo.app"
          test -d "$APP"
          hdiutil create \
            -volname "IMGo" \
            -srcfolder "$APP" \
            -ov \
            -format UDZO \
            "IMGo-${VERSION}-macos-universal.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IMGo-${{ needs.metadata.outputs.version }}-macos-universal
          path: IMGo-*.dmg
          if-no-files-found: error

  publish:
    name: Publish release
    runs-on: ubuntu-24.04
    needs: [metadata, build]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.dmg \
            --title "IMGo ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            || gh release upload "${GITHUB_REF_NAME}" dist/*.dmg --clobber
