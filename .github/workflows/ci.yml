name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: 1.97.1

jobs:
  check:
    name: Lint, test, and build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install native build dependencies
        run: brew install cmake ninja meson nasm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          toolchain: ${{ env.RUST_VERSION }}

      - name: Apply native source patches
        run: ./scripts/init-deps.sh

      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Format
        run: cargo fmt --all --check

      - name: Test
        run: cargo test -p imgo-shared -p minifier -p minifier-ffi

      - name: Build Rust core for the app
        run: ./macos/build-core.sh

      - name: Build macOS app
        run: |
          set -o pipefail
          xcodebuild -project macos/IMGo.xcodeproj \
            -scheme IMGo \
            -configuration Debug \
            -destination 'platform=macOS' \
            build \
            | tail -20
