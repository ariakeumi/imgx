[workspace]
resolver = "2"
members = [
    "crates/minifier",
    "crates/minifier-ffi",
    "crates/minifier-utils",
    "crates/shared",
    "deps/libheif-sys",
    "deps/jpegxl-rs/jpegxl-src",
]

[profile.release]
strip = true  # Automatically strip symbols from the binary.
opt-level = 3
lto = true
codegen-units = 1

[patch.crates-io]
libheif-sys = { path = "./deps/libheif-sys" }
jpegxl-src = { path = "./deps/jpegxl-rs/jpegxl-src" }
